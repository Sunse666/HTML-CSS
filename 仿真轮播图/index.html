<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仿真轮播图</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>

<div class="mystery-carousel" id="mysteryCarousel">
  <div class="carousel-stage" id="carouselStage">
  </div>
  <div class="carousel-vignette"></div>
</div>

<script src="index.js"></script>
<script>
  const IMAGE_DIR = 'images/';

  fetch(IMAGE_DIR + 'images.json')
    .then(res => res.json())
    .then(files => {
      const carousel = new MysteryCarousel('#mysteryCarousel', {
        images: files.map(f => IMAGE_DIR + f),
        autoInterval: 2000,
        stayDuration: 2000,
        slideDuration: 800,
      });
    });
</script>
</body>
</html>
